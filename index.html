<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آرشیو سینمای من | Cinema Seyyed</title>
  
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --card-border: #232b38;
      --accent: #e59934;
      --accent-hover: #f5ab48;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --friend-badge: #8b5cf6;
      --top-rating: #eab308;
      --imdb-yellow: #f5c518;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(21, 26, 35, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky; top: 0; z-index: 50;
      padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.4rem; font-weight: 800; color: var(--accent); }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    .btn {
      background: var(--accent); color: #0f172a; border: none;
      padding: 10px 18px; border-radius: 8px; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
      transition: all 0.2s ease;
    }
    .btn:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .btn-imdb {
      background: var(--imdb-yellow); color: #000; font-weight: 800;
      padding: 0 16px; border: none; border-radius: 8px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; white-space: nowrap;
    }
    .btn-imdb:hover { opacity: 0.9; }

    .btn-secondary { background: #1e293b; color: var(--text-main); border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: #334155; }

    .btn-icon {
      background: #151a23; border: 1px solid var(--card-border); color: var(--text-muted);
      width: 40px; height: 40px; border-radius: 8px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: all 0.2s;
    }
    .btn-icon:hover { color: var(--danger); border-color: var(--danger); }

    .container { max-width: 1280px; margin: 0 auto; padding: 24px 20px; width: 100%; flex: 1; }

    .view-tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; flex-wrap: wrap; }
    .tab-btn {
      background: #101520; color: var(--text-muted); border: 1px solid var(--card-border);
      padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--card-bg); color: var(--accent); border-color: var(--accent); }
    .tab-btn.tab-top.active { color: var(--top-rating); border-color: var(--top-rating); }

    .stats-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 14px 18px; border-radius: 10px; display: flex; align-items: center; gap: 14px;
    }
    .stat-card i { font-size: 1.8rem; color: var(--accent); }
    .stat-info div:first-child { font-size: 0.8rem; color: var(--text-muted); }
    .stat-info div:last-child { font-size: 1.25rem; font-weight: bold; }

    .controls-panel {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
      display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between;
    }

    .search-box { flex: 1; min-width: 260px; position: relative; }
    .search-box i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    .search-box input {
      width: 100%; padding: 10px 42px 10px 14px; background: #0f141c;
      border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }

    .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
    select {
      background: #0f141c; border: 1px solid var(--card-border); color: var(--text-main);
      padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; outline: none; cursor: pointer;
    }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
    .movie-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .movie-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4); border-color: #3b4759; }

    .poster-box { width: 100%; height: 330px; position: relative; background: #111620; overflow: hidden; }
    .poster-box img { width: 100%; height: 100%; object-fit: cover; }
    .poster-fallback { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 8px; }

    .badge-status { position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; backdrop-filter: blur(8px); }
    .badge-friend {
      position: absolute; bottom: 12px; right: 12px; background: rgba(139, 92, 246, 0.85);
      color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700;
      backdrop-filter: blur(8px); display: flex; align-items: center; gap: 5px;
    }
    .badge-ten {
      position: absolute; top: 12px; right: 12px; background: rgba(234, 179, 8, 0.9);
      color: #000; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 4px;
    }

    .status-watched { background: rgba(16, 185, 129, 0.85); color: #fff; }
    .status-plan { background: rgba(229, 153, 52, 0.85); color: #000; }

    .movie-body { padding: 16px; display: flex; flex-direction: column; flex: 1; gap: 6px; }
    .movie-title { font-size: 1.1rem; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-director { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .movie-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 0.85rem; }
    .rating-badge { display: inline-flex; align-items: center; gap: 4px; color: #f59e0b; font-weight: bold; }
    .rating-badge.is-perfect { color: #eab308; background: rgba(234, 179, 8, 0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(234, 179, 8, 0.4); }
    .movie-notes {
      font-size: 0.8rem; color: #94a3b8; margin-top: 8px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;
    }

    .card-actions {
      display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px;
      background: rgba(0, 0, 0, 0.2); border-top: 1px solid var(--card-border);
    }
    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; padding: 6px; border-radius: 4px; }
    .action-btn:hover { color: var(--text-main); }
    .action-btn.delete:hover { color: var(--danger); }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 14px; width: 100%; max-width: 520px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 1.15rem; color: var(--accent); }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; max-height: 75vh; overflow-y: auto; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); }
    .form-group input, .form-group textarea, .form-group select {
      background: #0d1219; border: 1px solid var(--card-border); border-radius: 8px;
      padding: 10px 14px; color: var(--text-main); outline: none;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }

    .input-with-btn { display: flex; gap: 8px; }
    .input-with-btn input { flex: 1; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-footer {
      padding: 16px 24px; border-top: 1px solid var(--card-border);
      display: flex; justify-content: flex-end; gap: 12px; background: rgba(0, 0, 0, 0.15);
    }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
    .empty-state i { font-size: 3rem; margin-bottom: 14px; color: #334155; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <i class="fa-solid fa-film"></i>
      <span>سینمای من</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i>
        <span>افزودن فیلم</span>
      </button>
      <button class="btn-icon" title="خروج از حالت مدیریت (پاک کردن رمز ذخیره‌شده)" onclick="logoutAdmin()">
        <i class="fa-solid fa-lock"></i>
      </button>
    </div>
  </header>

  <div class="container">
    
    <div class="view-tabs">
      <button class="tab-btn active" id="tabAll" onclick="switchTab('all')">
        <i class="fa-solid fa-layer-group"></i>
        <span>تمام فیلم‌ها</span>
      </button>
      <button class="tab-btn tab-top" id="tabTopTen" onclick="switchTab('top10')">
        <i class="fa-solid fa-crown" style="color: var(--top-rating);"></i>
        <span>فیلم‌های ۱۰ از ۱۰</span>
      </button>
      <button class="tab-btn" id="tabMine" onclick="switchTab('mine')">
        <i class="fa-solid fa-user"></i>
        <span>آرشیو شخصی من</span>
      </button>
      <button class="tab-btn" id="tabFriends" onclick="switchTab('friends')">
        <i class="fa-solid fa-user-group"></i>
        <span>پیشنهادی دوستان</span>
      </button>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <i class="fa-solid fa-clapperboard"></i>
        <div class="stat-info">
          <div>عناوین در این بخش</div>
          <div id="statTotal">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-crown" style="color: var(--top-rating);"></i>
        <div class="stat-info">
          <div>شاهکارها (۱۰ از ۱۰)</div>
          <div id="statTenCount">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-circle-check" style="color: var(--success);"></i>
        <div class="stat-info">
          <div>دیده‌شده</div>
          <div id="statWatched">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-bookmark" style="color: var(--accent);"></i>
        <div class="stat-info">
          <div>در صف تماشا</div>
          <div id="statPlan">۰</div>
        </div>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-user-group" style="color: var(--friend-badge);"></i>
        <div class="stat-info">
          <div>پیشنهاد دوستان</div>
          <div id="statFriendsCount">۰</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="جستجو بر اساس نام فیلم، کارگردان یا نام دوست..." oninput="filterMovies()">
      </div>
      <div class="filter-group">
        <select id="statusFilter" onchange="filterMovies()">
          <option value="all">همه وضعیت‌ها</option>
          <option value="watched">دیده‌شده</option>
          <option value="plan">در صف تماشا</option>
        </select>
        <select id="sortSelect" onchange="filterMovies()">
          <option value="newest">جدیدترین‌های ثبت‌شده</option>
          <option value="ratingDesc">بیشترین امتیاز شخصی</option>
          <option value="imdbDesc">بیشترین امتیاز IMDb</option>
          <option value="yearDesc">سال انتشار (نزولی)</option>
        </select>
      </div>
    </div>

    <div class="movies-grid" id="moviesContainer">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p>در حال بارگذاری آرشیو فیلم‌ها...</p>
      </div>
    </div>

  </div>

  <!-- مودال ثبت / ویرایش اثر -->
  <div class="modal-backdrop" id="movieModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">ثبت فیلم جدید</h3>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="movieForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="editKey">
        <div class="modal-body">
          <div class="form-group">
            <label>عنوان فیلم (انگلیسی تایپ کنید تا دقیق پیدا شود) *</label>
            <div class="input-with-btn">
              <input type="text" id="movieTitleInput" required placeholder="مثال: Taxi Driver یا The Shining">
              <button type="button" class="btn-imdb" id="fetchImdbBtn" onclick="fetchFromIMDb()">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span id="imdbBtnText">یافتن در IMDb</span>
              </button>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>کارگردان</label>
              <input type="text" id="directorInput" placeholder="نام کارگردان...">
            </div>
            <div class="form-group">
              <label>سال ساخت</label>
              <input type="number" id="yearInput" placeholder="سال ساخت..." min="1888" max="2035">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>پیشنهاددهنده (دوست)</label>
              <input type="text" id="suggestedByInput" placeholder="نام دوست (اختیاری)...">
            </div>
            <div class="form-group">
              <label>وضعیت تماشا</label>
              <select id="watchStatusInput">
                <option value="plan">می‌خواهم ببینم (Watchlist)</option>
                <option value="watched">تماشا کرده‌ام</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>امتیاز شخصی (از ۱۰)</label>
              <input type="number" id="ratingInput" step="0.1" min="0" max="10" placeholder="مثال: 10 یا 9.5">
            </div>
            <div class="form-group">
              <label>امتیاز رسمی IMDb</label>
              <input type="number" id="imdbInput" step="0.1" min="0" max="10" placeholder="دریافت خودکار...">
            </div>
          </div>

          <div class="form-group">
            <label>لینک پوستر فیلم (URL)</label>
            <input type="url" id="posterInput" placeholder="دریافت خودکار پوستر...">
          </div>

          <div class="form-group">
            <label>خلاصه داستان / یادداشت شخصی</label>
            <textarea id="notesInput" rows="3" placeholder="خلاصه یا نظر شخصی درباره اثر..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">انصراف</button>
          <button type="submit" class="btn">ذخیره اثر</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const OMDB_API_KEY = "ba5115ac";

    const firebaseConfig = {
      apiKey: "AIzaSyBsu8JMHum33C-LUIZiTLO1v-D1qJJr1_Y",
      authDomain: "cinema-seyyed.firebaseapp.com",
      databaseURL: "https://cinema-seyyed-default-rtdb.firebaseio.com",
      projectId: "cinema-seyyed",
      storageBucket: "cinema-seyyed.firebasestorage.app",
      messagingSenderId: "337880714768",
      appId: "1:337880714768:web:d3e7cc2c5b14712614c495"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const moviesRef = db.ref('movies');

    let allMovies = [];
    let currentTab = 'all';

    // رمز عبور بخش مدیریت (ثبت و ویرایش)
    const ADMIN_PASSWORD = "007";
    const AUTH_KEY = "cinema_admin_authed";

    // بررسی رمز عبور با قابلیت حافظه (localStorage)
    function checkAdminAuth() {
      if (localStorage.getItem(AUTH_KEY) === "true") {
        return true;
      }
      const pass = prompt("🔒 لطفاً رمز عبور را وارد کنید:");
      if (pass === null) return false;
      if (pass.trim() === ADMIN_PASSWORD) {
        localStorage.setItem(AUTH_KEY, "true");
        return true;
      } else {
        alert("⛔ رمز عبور اشتباه است!");
        return false;
      }
    }

    // خروج از حالت ادمین برای مواقع لازم
    function logoutAdmin() {
      if (localStorage.getItem(AUTH_KEY) === "true") {
        localStorage.removeItem(AUTH_KEY);
        alert("🔒 دسترسی مدیریت قفل شد. برای افزودن یا ویرایش بعدی باید دوباره رمز را وارد کنید.");
      } else {
        alert("سیستم در حال حاضر قفل است.");
      }
    }

    function isPerfectTen(rating) {
      const num = parseFloat(rating);
      return !isNaN(num) && num === 10;
    }

    async function fetchFromIMDb() {
      const titleInput = document.getElementById('movieTitleInput');
      const title = titleInput.value.trim();
      if (!title) {
        alert('لطفاً ابتدا نام فیلم را تایپ کنید.');
        return;
      }

      const btnText = document.getElementById('imdbBtnText');
      btnText.innerText = 'در حال جستجو...';

      try {
        const url = `https://www.omdbapi.com/?t=${encodeURIComponent(title)}&apikey=${OMDB_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.Response === "True") {
          titleInput.value = data.Title || title;
          document.getElementById('directorInput').value = (data.Director && data.Director !== "N/A") ? data.Director : '';
          document.getElementById('yearInput').value = data.Year ? parseInt(data.Year) : '';
          document.getElementById('imdbInput').value = (data.imdbRating && data.imdbRating !== "N/A") ? data.imdbRating : '';
          
          if (data.Poster && data.Poster !== "N/A") {
            document.getElementById('posterInput').value = data.Poster.replace(/^http:\/\//i, 'https://');
          }
          
          document.getElementById('notesInput').value = (data.Plot && data.Plot !== "N/A") ? data.Plot : '';
        } else {
          alert('فیلمی با این نام در IMDb یافت نشد: ' + (data.Error || 'نام انگلیسی دقیق را وارد کنید.'));
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور IMDb.');
        console.error(err);
      } finally {
        btnText.innerText = 'یافتن در IMDb';
      }
    }

    // دریافت لحظه‌ای داده‌ها از فایربیس
    moviesRef.on('value', snapshot => {
      const data = snapshot.val();
      allMovies = [];
      if (data) {
        Object.keys(data).forEach(key => {
          allMovies.push({ key, ...data[key] });
        });
      }
      updateStats();
      filterMovies();
    }, error => {
      console.error("Firebase Error:", error);
      document.getElementById('moviesContainer').innerHTML = `
        <div class="empty-state">
          <i class="fa-solid fa-triangle-exclamation" style="color: var(--danger);"></i>
          <p style="color: var(--danger); font-weight: bold;">خطای دسترسی به دیتابیس فایربیس</p>
          <p style="font-size: 0.85rem; margin-top: 6px;">در بخش Realtime Database > Rules پروژه cinema-seyyed مقدار read و write را true بگذارید.</p>
        </div>`;
    });

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'all') document.getElementById('tabAll').classList.add('active');
      if (tab === 'top10') document.getElementById('tabTopTen').classList.add('active');
      if (tab === 'mine') document.getElementById('tabMine').classList.add('active');
      if (tab === 'friends') document.getElementById('tabFriends').classList.add('active');
      
      updateStats();
      filterMovies();
    }

    function updateStats() {
      let currentList = allMovies;
      if (currentTab === 'top10') {
        currentList = allMovies.filter(m => isPerfectTen(m.rating));
      } else if (currentTab === 'mine') {
        currentList = allMovies.filter(m => !m.suggestedBy || m.suggestedBy.trim() === '');
      } else if (currentTab === 'friends') {
        currentList = allMovies.filter(m => m.suggestedBy && m.suggestedBy.trim() !== '');
      }

      const total = currentList.length;
      const watched = currentList.filter(m => m.status === 'watched').length;
      const plan = total - watched;
      const tenCount = allMovies.filter(m => isPerfectTen(m.rating)).length;
      const friendsCount = allMovies.filter(m => m.suggestedBy && m.suggestedBy.trim() !== '').length;

      document.getElementById('statTotal').innerText = total.toLocaleString('fa-IR');
      document.getElementById('statTenCount').innerText = tenCount.toLocaleString('fa-IR');
      document.getElementById('statWatched').innerText = watched.toLocaleString('fa-IR');
      document.getElementById('statPlan').innerText = plan.toLocaleString('fa-IR');
      document.getElementById('statFriendsCount').innerText = friendsCount.toLocaleString('fa-IR');
    }

    function filterMovies() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;
      const sortBy = document.getElementById('sortSelect').value;

      let filtered = allMovies.filter(item => {
        if (currentTab === 'top10' && !isPerfectTen(item.rating)) return false;
        if (currentTab === 'mine' && item.suggestedBy && item.suggestedBy.trim() !== '') return false;
        if (currentTab === 'friends' && (!item.suggestedBy || item.suggestedBy.trim() === '')) return false;

        const matchesQuery = (item.title && item.title.toLowerCase().includes(query)) ||
                             (item.director && item.director.toLowerCase().includes(query)) ||
                             (item.suggestedBy && item.suggestedBy.toLowerCase().includes(query));
        const matchesStatus = (statusFilter === 'all') || (item.status === statusFilter);
        return matchesQuery && matchesStatus;
      });

      filtered.sort((a, b) => {
        if (sortBy === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
        if (sortBy === 'ratingDesc') return (parseFloat(b.rating) || 0) - (parseFloat(a.rating) || 0);
        if (sortBy === 'imdbDesc') return (parseFloat(b.imdbRating) || 0) - (parseFloat(a.imdbRating) || 0);
        if (sortBy === 'yearDesc') return (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
        return 0;
      });

      renderMovies(filtered);
    }

    function renderMovies(list) {
      const container = document.getElementById('moviesContainer');
      if (list.length === 0) {
        let emptyMsg = 'هنوز اثری در این بخش ثبت نشده است.';
        if (currentTab === 'top10') {
          emptyMsg = 'هنوز هیچ فیلمی با امتیاز ۱۰ ثبت نشده است!';
        }
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-film"></i>
            <p>${emptyMsg}</p>
            <p style="font-size: 0.85rem; margin-top: 6px;">روی دکمه «افزودن فیلم» در بالا کلیک کنید.</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const isWatched = item.status === 'watched';
        const isTen = isPerfectTen(item.rating);

        return `
          <div class="movie-card">
            <div class="poster-box">
              ${item.posterUrl 
                ? `<img src="${escapeHtml(item.posterUrl)}" alt="${escapeHtml(item.title)}" onerror="this.src='https://via.placeholder.com/300x450/151a23/94a3b8?text=No+Poster'">`
                : `<div class="poster-fallback"><i class="fa-solid fa-clapperboard fa-2x"></i><span>بدون پوستر</span></div>`
              }
              <div class="badge-status ${isWatched ? 'status-watched' : 'status-plan'}">
                ${isWatched ? 'دیده‌شده' : 'در صف تماشا'}
              </div>

              ${isTen ? `
                <div class="badge-ten" title="شاهکار ۱۰ از ۱۰">
                  <i class="fa-solid fa-crown"></i> 10 / 10
                </div>
              ` : ''}

              ${item.suggestedBy ? `
                <div class="badge-friend" title="پیشنهاد شده توسط ${escapeHtml(item.suggestedBy)}">
                  <i class="fa-solid fa-user-tag"></i> ${escapeHtml(item.suggestedBy)}
                </div>
              ` : ''}
            </div>

            <div class="movie-body">
              <h4 class="movie-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</h4>
              <div class="movie-director">
                <i class="fa-solid fa-video"></i>
                <span>${item.director ? escapeHtml(item.director) : 'کارگردان نامشخص'}</span>
              </div>
              <div class="movie-meta">
                <span>${item.year ? item.year : '—'}</span>
                <div>
                  ${item.rating ? `<span class="rating-badge ${isTen ? 'is-perfect' : ''}"><i class="fa-solid fa-star"></i> ${item.rating}</span>` : ''}
                  ${item.imdbRating ? `<span style="color:#eab308; margin-right: 6px; font-size:0.75rem;">IMDb: ${item.imdbRating}</span>` : ''}
                </div>
              </div>
              ${item.notes ? `<p class="movie-notes" title="${escapeHtml(item.notes)}">${escapeHtml(item.notes)}</p>` : ''}
            </div>

            <div class="card-actions">
              <button class="action-btn" title="تغییر وضعیت" onclick="toggleStatus('${item.key}', '${item.status}')">
                <i class="fa-solid ${isWatched ? 'fa-bookmark' : 'fa-check'}"></i>
              </button>
              <button class="action-btn" title="ویرایش" onclick="editMovie('${item.key}')">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              <button class="action-btn delete" title="حذف" onclick="deleteMovie('${item.key}')">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // افزودن فیلم جدید با بررسی رمز و حافظه
    function openAddModal() {
      if (!checkAdminAuth()) return;

      document.getElementById('movieForm').reset();
      document.getElementById('editKey').value = '';
      document.getElementById('modalTitle').innerText = 'ثبت فیلم جدید';
      document.getElementById('movieModal').style.display = 'flex';
    }

    // ویرایش فیلم با بررسی رمز و حافظه
    function editMovie(key) {
      if (!checkAdminAuth()) return;

      const item = allMovies.find(m => m.key === key);
      if (!item) return;

      document.getElementById('editKey').value = item.key;
      document.getElementById('movieTitleInput').value = item.title || '';
      document.getElementById('directorInput').value = item.director || '';
      document.getElementById('yearInput').value = item.year || '';
      document.getElementById('suggestedByInput').value = item.suggestedBy || '';
      document.getElementById('ratingInput').value = item.rating || '';
      document.getElementById('imdbInput').value = item.imdbRating || '';
      document.getElementById('watchStatusInput').value = item.status || 'plan';
      document.getElementById('posterInput').value = item.posterUrl || '';
      document.getElementById('notesInput').value = item.notes || '';

      document.getElementById('modalTitle').innerText = 'ویرایش اثر';
      document.getElementById('movieModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('movieModal').style.display = 'none';
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const key = document.getElementById('editKey').value;

      const movieData = {
        title: document.getElementById('movieTitleInput').value.trim(),
        director: document.getElementById('directorInput').value.trim(),
        year: document.getElementById('yearInput').value.trim(),
        suggestedBy: document.getElementById('suggestedByInput').value.trim(),
        rating: document.getElementById('ratingInput').value.trim(),
        imdbRating: document.getElementById('imdbInput').value.trim(),
        status: document.getElementById('watchStatusInput').value,
        posterUrl: document.getElementById('posterInput').value.trim(),
        notes: document.getElementById('notesInput').value.trim(),
        updatedAt: Date.now()
      };

      if (key) {
        moviesRef.child(key).update(movieData).then(() => closeModal());
      } else {
        movieData.createdAt = Date.now();
        moviesRef.push(movieData).then(() => closeModal());
      }
    }

    function toggleStatus(key, currentStatus) {
      const newStatus = currentStatus === 'watched' ? 'plan' : 'watched';
      moviesRef.child(key).update({ status: newStatus });
    }

    function deleteMovie(key) {
      if (confirm('آیا از حذف این اثر از آرشیو اطمینان دارید؟')) {
        moviesRef.child(key).remove();
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onclick = function(event) {
      const modal = document.getElementById('movieModal');
      if (event.target === modal) closeModal();
    }
  </script>
</body>
</html>
